<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make It Right — Claim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="module" src="/web/screens.js"></script>
<style>
:root {
  --paper: #F4EFE6;
  --ink: #23201C;
  --graphite: #2B2926;
  --sage: #6E8B5E;
  --ochre: #C98A1B;
  --terracotta: #B8502E;
  --slot: #D9D5CF;
  --font-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
:root {
  --rule-head: #67655F;
  --rule-dark: #7D7A74;
  --rule: #8F8C86;
  --rule-pale: #ADAAA4;
  --rule-strong: #827F7A;
  --rule-light: #C4C0B9;
  --rule-soft: #BDB9B2;
  --divider: #D4CFC7;
  --vsep: #8F8C86;
  --text-gray: #75716D;
  --caption: #8C8984;
  --quote: #6F6B66;
  --done-muted: #958D89;
  --slot-dark: #CAC7C1;
  --tray-card: #EEEAE1;
  --tray-card-border: #D7D2C9;
  --stamp-fill: #F4F0E8;
  --stamp-shadow: rgba(35, 32, 28, 0.28);
  --on-graphite: #F6F2EA;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-serif);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
.page {
  width: 1440px;
  min-height: 810px;
  padding-bottom: 20px;
  position: relative;
}
.mono { font-family: var(--font-mono); }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- top bar ---------- */
.topbar {
  height: 55.5px;
  border-bottom: 1px solid var(--rule-head);
  display: flex;
  align-items: flex-start;
  padding: 0 35.3px 0 40px;
}
.wordmark {
  flex: none;
  width: 196.2px;
  margin-top: 9.68px;
  font-weight: 650;
  font-size: 29.2px;
  letter-spacing: -0.45px;
  line-height: 36px;
  height: 36px;
  white-space: nowrap;
  color: var(--ink);
  text-decoration: none;
}
.vsep { flex: none; width: 1px; height: 29.3px; margin-top: 13.3px; background: var(--vsep); }
.env { flex: none; margin: 18.3px 0 0 22.4px; font-size: 17.1px; line-height: 22px; height: 22px; white-space: nowrap; color: var(--text-gray); }
.nav { margin-left: auto; margin-top: 17px; display: flex; gap: 20px; }
.nav a { font-size: 16px; line-height: 22px; color: var(--text-gray); text-decoration: none; white-space: nowrap; }
.nav a[aria-current="page"] { color: var(--ink); font-weight: 600; }

/* ---------- headline ---------- */
.headline {
  margin: 25.95px 0 0 0;
  padding-left: 40.3px;
  height: 56px;
  font-weight: 690;
  font-size: 49px;
  line-height: 56px;
  white-space: nowrap;
  letter-spacing: -0.95px;
}
.provenance { margin: 4px 0 0 40.3px; font-size: 14.5px; line-height: 19px; color: var(--quote); }
.notice { margin: 8px 40.3px 0; padding: 8px 12px; border: 1px solid var(--rule); font-size: 15px; line-height: 20px; }

/* ---------- board ---------- */
.board {
  margin-top: 15.05px;
  padding-left: 39.25px;
  display: grid;
  grid-template-columns: 1041.05px 311.7px;
  column-gap: 13.4px;
  grid-template-rows: auto auto;
  grid-template-areas: "cards summary" "tray summary";
  align-items: start;
}
.cards {
  grid-area: cards;
  display: grid;
  grid-template-columns: 513.85px 512.6px;
  column-gap: 14.6px;
  grid-template-rows: 216.1px 220.3px;
  grid-auto-rows: 220.3px;
  padding-top: 0.8px;
  row-gap: 14.4px;
}

/* claim card: Promised | Photo shows */
.claim-card {
  border: 1px solid var(--rule);
  border-color: var(--rule-dark) var(--rule) var(--rule-pale) var(--rule-dark);
  display: grid;
  grid-template-columns: 244.35px minmax(0, 1fr);
  min-width: 0;
}
.promised { padding: 10.7px 16px 0 17px; display: flex; flex-direction: column; min-width: 0; }
.lbl { height: 20px; font-weight: 430; font-size: 14.2px; line-height: 20px; letter-spacing: -0.13px; white-space: nowrap; }
.evidence .lbl { letter-spacing: -0.45px; }
.quote {
  margin: 8.3px 0 0;
  height: 34px;
  font-style: italic;
  font-size: 14px;
  line-height: 17px;
  color: var(--quote);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.source { margin-top: 1.7px; height: 16px; font-size: 13px; line-height: 16px; white-space: nowrap; color: var(--quote); }
.item-title { margin: 25.5px 0 0; height: 28px; font-weight: 690; font-size: 23.6px; line-height: 28px; letter-spacing: -0.6px; }
.item-price { margin-top: 2.4px; height: 24px; font-weight: 400; font-size: 20.7px; line-height: 24px; white-space: nowrap; }
.note {
  margin: 6px 0 0;
  font-size: 12.5px;
  line-height: 15px;
  color: var(--caption);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.claim-card:nth-of-type(n+3) .promised { padding-top: 11.9px; }
.claim-card:nth-of-type(n+3) .item-title { margin-top: 28.1px; }
.claim-card:nth-of-type(n+3) .item-price { margin-top: 1.9px; }

.evidence { border-left: 1px solid var(--divider); padding: 10.7px 0 0 15.8px; min-width: 0; }
.claim-card:nth-of-type(n+3) .evidence { padding-top: 11.9px; }
.photo { position: relative; margin: 1.9px 0 0; width: 235.5px; height: 166px; background: var(--slot); }
.claim-card:nth-of-type(n+3) .photo { margin-top: 3.6px; }
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; }

/* verdict stamps (HTML/CSS, not raster) */
.stamp {
  position: absolute;
  left: 177px;
  top: 132px;
  --rot: -9.5deg;
  transform: translate(-50%, -50%) rotate(var(--rot));
  padding: 3.9px;
  background: var(--stamp-fill);
  border-radius: 4px;
  box-shadow: 0 1px 3px var(--stamp-shadow);
}
.stamp-box {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2.2px solid currentColor;
  border-radius: 3px;
  font-weight: 640;
  line-height: 1;
  white-space: nowrap;
}
.stamp[data-state="not-done"] { color: var(--terracotta); }
.stamp[data-state="partly"] { color: var(--ochre); left: 163.2px; --rot: -10.1deg; }
.stamp[data-state="unclear"] { color: var(--text-gray); }
.stamp[data-state="not-done"] .stamp-box { width: 119.6px; height: 41.3px; font-size: 23.3px; letter-spacing: -0.1px; }
.stamp[data-state="partly"] .stamp-box, .stamp[data-state="unclear"] .stamp-box { width: 145.8px; height: 43.7px; font-size: 20.4px; }

/* ---------- summary column ---------- */
.summary {
  grid-area: summary;
  min-height: 632.8px;
  border: 1px solid var(--rule-pale);
  border-top-color: var(--rule-dark);
  padding: 0 18.7px 18px 19.7px;
  display: flex;
  flex-direction: column;
}
.payee { margin: 18px 0 0; height: 22px; font-weight: 600; font-size: 20px; line-height: 22px; }
.meta { height: 17.5px; font-size: 13.5px; line-height: 17.5px; white-space: nowrap; color: var(--quote); }
.meta.m1 { margin-top: 0.5px; }
.rule { flex: none; height: 1px; background: var(--rule); }
.rule.light { background: var(--rule-light); }
.rule.r1 { margin-top: 23.7px; background: var(--rule-dark); }
.sum-row { display: flex; justify-content: space-between; align-items: baseline; white-space: nowrap; }
.sum-row .k { font-weight: 450; font-size: 20.6px; line-height: 24px; letter-spacing: -0.3px; }
.sum-row .v { font-weight: 500; font-size: 19.6px; line-height: 24px; letter-spacing: -0.2px; }
.row-paid { height: 63.2px; padding-top: 21.55px; }
.row-proven { height: 60.1px; padding-top: 17.75px; }
.row-proven .v { letter-spacing: 0.35px; }
.row-claim { height: 67.5px; padding-top: 19.18px; }
.row-claim .k { font-weight: 620; font-size: 23.2px; line-height: 28px; letter-spacing: -0.4px; }
.row-claim .v { font-weight: 600; letter-spacing: -0.15px; }
.file-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 17.6px;
  min-height: 64.6px;
  padding: 8px 12px;
  background: var(--graphite);
  color: var(--on-graphite);
  text-align: center;
  text-decoration: none;
  font-weight: 540;
  font-size: 22px;
  line-height: 26px;
  letter-spacing: -0.22px;
  cursor: pointer;
}
.file-btn[aria-busy="true"], .small-btn[aria-busy="true"] { opacity: 0.6; cursor: progress; }
.file-note { margin: 9.2px 0 0; font-size: 14.5px; line-height: 17.5px; text-align: center; color: var(--caption); }
.small-btn {
  margin: 10px auto 0;
  display: block;
  background: none;
  border: 1px solid var(--rule);
  padding: 6px 12px;
  font: inherit;
  font-size: 14.5px;
  color: var(--ink);
  cursor: pointer;
}
.rule.r5 { margin-top: 12px; }
.line { margin: 12px 0 0; font-size: 13.5px; line-height: 17.5px; color: var(--quote); overflow-wrap: anywhere; }
.next { margin-top: 14px; font-size: 16px; color: var(--ink); }

/* ---------- removed-from-claim tray ---------- */
.tray {
  grid-area: tray;
  margin-top: 16.7px;
  min-height: 164.5px;
  border: 1px solid var(--rule);
  border-left-color: var(--rule-dark);
  border-top: 2px solid var(--rule-strong);
  border-bottom-color: var(--rule-soft);
  padding: 0 11.4px 12px 10.85px;
}
.tray-title { margin: 11.33px 0 0 6.6px; height: 28px; font-weight: 600; font-size: 23.2px; letter-spacing: -0.3px; line-height: 28px; white-space: nowrap; color: var(--ink); }
.done-row { margin-top: 9.07px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 13.4px; }
.done-card {
  position: relative;
  min-width: 0;
  height: 106.1px;
  border: 1px solid var(--tray-card-border);
  border-radius: 3px;
  background: var(--tray-card);
  display: flex;
  align-items: flex-start;
  padding: 8.1px 0 0 9.05px;
}
.done-photo { flex: none; width: 116px; height: 87.85px; border-radius: 2px; background: var(--slot); overflow: hidden; }
.done-photo img { display: block; width: 100%; height: 100%; object-fit: cover; filter: saturate(0.7) opacity(0.85); }
.done-text { margin-left: 16.9px; padding-right: 10px; display: flex; flex-direction: column; min-width: 0; }
.done-text .name {
  margin-top: 8px;
  font-size: 15.5px;
  line-height: 19px;
  color: var(--done-muted);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.done-text .amt { margin-top: 4px; height: 20px; font-size: 17.2px; line-height: 20px; white-space: nowrap; color: var(--done-muted); }
.stamp.done {
  left: 92px;
  top: 78px;
  --rot: -12.8deg;
  padding: 0;
  background: var(--stamp-fill);
  box-shadow: none;
  color: var(--sage);
}
.stamp.done .stamp-box { width: 85.4px; height: 36.2px; border-width: 2px; font-size: 18.5px; letter-spacing: -0.2px; gap: 5px; }
.stamp.done svg { width: 15px; height: 14px; display: block; }

/* ---------- 390 ---------- */
@media (max-width: 600px) {
  .page { width: 100%; min-height: 0; padding-bottom: 24px; }
  .topbar { height: auto; min-height: 49px; padding: 8px 16px; align-items: center; flex-wrap: wrap; row-gap: 4px; }
  .wordmark { width: auto; margin-top: 0; font-size: 24px; line-height: 30px; height: 30px; }
  .vsep { margin: 0 0 0 14px; height: 24px; }
  .env { margin: 0 0 0 14px; font-size: 15px; height: auto; }
  .nav { margin: 0; width: 100%; gap: 14px; }
  .nav a { font-size: 14px; }
  .headline { margin: 22px 16px 0; padding-left: 0; height: auto; white-space: normal; font-size: 28px; line-height: 34px; }
  .provenance { margin: 8px 16px 0; font-size: 13.5px; }
  .notice { margin: 8px 16px 0; }
  .board { margin-top: 20px; padding: 0 16px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "summary" "cards" "tray"; row-gap: 16px; }
  .summary { min-height: 0; padding: 0 18px 20px; }
  .payee { height: auto; }
  .sum-row .k { font-size: 18px; }
  .row-claim .k { font-size: 21px; }
  .sum-row .v { font-size: 17.5px; }
  .row-paid, .row-proven, .row-claim { height: 58px; padding-top: 17px; }
  .file-btn { font-size: 20px; }
  .cards { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-auto-rows: auto; row-gap: 16px; }
  .claim-card { grid-template-columns: minmax(0, 1fr); }
  .promised, .claim-card:nth-of-type(n+3) .promised { padding: 12px 16px 14px; }
  .quote { height: auto; margin-top: 8px; }
  .source { margin-top: 3px; height: auto; }
  .item-title, .claim-card:nth-of-type(n+3) .item-title { margin-top: 14px; font-size: 22px; height: auto; white-space: normal; }
  .item-price, .claim-card:nth-of-type(n+3) .item-price { margin-top: 2px; }
  .evidence, .claim-card:nth-of-type(n+3) .evidence { border-left: 0; border-top: 1px solid var(--divider); padding: 12px 16px 16px; }
  .photo, .claim-card:nth-of-type(n+3) .photo { margin-top: 6px; width: 100%; height: auto; aspect-ratio: 235.5 / 166; container-type: inline-size; }
  /* stamps scale with the photo: same spot, same share of the frame as at 1440 */
  .stamp { left: 75.3%; top: 79.7%; padding: 1.65cqw; border-radius: 1.7cqw; }
  .stamp-box { border-width: 0.93cqw; border-radius: 1.27cqw; }
  .stamp[data-state="not-done"] .stamp-box { width: 50.7cqw; height: 17.5cqw; font-size: 9.87cqw; }
  .stamp[data-state="partly"] { left: 69.4%; top: 78.6%; }
  .stamp[data-state="partly"] .stamp-box, .stamp[data-state="unclear"] .stamp-box { width: 61.8cqw; height: 18.6cqw; font-size: 8.64cqw; }
  .tray { min-height: 0; margin-top: 0; padding: 0 12px 12px; }
  .tray-title { margin: 12px 0 0 4px; height: auto; white-space: normal; font-size: 20px; line-height: 26px; }
  .done-row { grid-template-columns: minmax(0, 1fr); row-gap: 12px; margin-top: 10px; }
  .stamp.done { padding: 0; border-radius: 4px; }
  .stamp.done .stamp-box { width: 85.4px; height: 36.2px; border-width: 2px; border-radius: 3px; font-size: 18.5px; }
}
</style>
</head>
<body data-screen="claim">
<div class="page">

  <header class="topbar">
    <a class="wordmark" href="/">Make It Right</a>
    <div class="vsep" aria-hidden="true"></div>
    <div class="env">PayPal sandbox</div>
    <nav class="nav" aria-label="Case">
      <a data-field="nav_promised" href="#">Promised items</a>
      <a data-field="nav_claim" href="#" aria-current="page">Claim</a>
      <a data-field="nav_offer" href="#">Offer</a>
      <a data-field="nav_money_back" href="#">Money back</a>
    </nav>
  </header>

  <h1 class="headline"><span data-field="paid_verb">You paid</span> <span data-field="paid_amount_short">—</span>. Photos prove <span data-field="proven_done_short">—</span> of work. Your claim: <span data-field="claim_amount_short">—</span>.</h1>
  <p class="provenance" data-field="analysis_note" hidden></p>
  <p class="notice" data-field="case_notice" hidden></p>
  <p class="notice" data-notice role="status" hidden></p>

  <main class="board">

    <section class="cards" aria-label="Claim: promised items not done" data-group="claim">
      <template>
        <article class="claim-card">
          <div class="promised">
            <div class="lbl">Promised</div>
            <p class="quote" data-field="promise_quote">—</p>
            <div class="source"><span data-field="promise_source">—</span> · <span data-field="promise_date">—</span></div>
            <h2 class="item-title ellipsis" data-field="item_title">—</h2>
            <div class="item-price mono" data-field="item_price_line">—</div>
            <p class="note" data-field="verdict_note"></p>
          </div>
          <div class="evidence">
            <div class="lbl">Photo shows</div>
            <figure class="photo">
              <img data-field="photo" alt="" hidden>
              <div class="stamp" data-field="verdict"><div class="stamp-box" data-field="verdict_label">—</div></div>
            </figure>
          </div>
        </article>
      </template>
    </section>

    <aside class="summary" aria-label="Claim summary">
      <div class="payee ellipsis" data-field="payee">—</div>
      <div class="meta m1" data-field="paid_line">—</div>
      <div class="meta">Reason: <span data-field="reason">—</span></div>
      <div class="rule r1"></div>
      <div class="sum-row row-paid"><span class="k">Paid</span><span class="v mono" data-field="paid_amount">—</span></div>
      <div class="rule light"></div>
      <div class="sum-row row-proven"><span class="k">Proven</span><span class="v mono" data-field="proven_done_negative">—</span></div>
      <div class="rule"></div>
      <div class="sum-row row-claim"><span class="k">Claim</span><span class="v mono" data-field="claim_amount">—</span></div>
      <div class="rule light"></div>
      <a class="file-btn" data-field="filing_url">File with PayPal</a>
      <p class="file-note" data-field="file_note">—</p>
      <button type="button" class="small-btn" data-field="check_paypal" hidden>Check PayPal now</button>
      <div class="rule r5"></div>
      <p class="line" data-field="claim_status" hidden></p>
      <p class="line" data-field="transaction" hidden></p>
      <p class="line" data-field="eligibility">—</p>
      <a class="next" data-field="next_step" href="#" hidden>The contractor's answer →</a>
    </aside>

    <section class="tray" aria-label="Removed from claim">
      <h2 class="tray-title">Removed from claim · photos prove done · <span data-field="proven_done_short">—</span></h2>
      <div class="done-row" data-group="tray">
        <template>
          <article class="done-card">
            <div class="done-photo"><img data-field="photo" alt="" hidden></div>
            <div class="done-text">
              <div class="name" data-field="item_title">—</div>
              <div class="amt mono" data-field="item_price">—</div>
            </div>
            <div class="stamp done" data-field="verdict"><div class="stamp-box"><svg viewBox="0 0 16 14" aria-hidden="true"><path d="M1.8 7.6 6 11.8 14.2 2.2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Done</div></div>
          </article>
        </template>
      </div>
    </section>

  </main>
</div>
</body>
</html>
